name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Repository invariants
        run: npm test

      - name: Agent Skills reference validator
        run: |
          pipx install skills-ref
          for skill in skills/*/; do
            agentskills validate "$skill"
          done

      - name: Installer discovery
        run: |
          expected=$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          npx --yes skills add . --list | tee "$RUNNER_TEMP/skills-list.txt"
          grep -q "Found ${expected} skills" "$RUNNER_TEMP/skills-list.txt"
